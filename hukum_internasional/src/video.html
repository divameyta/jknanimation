<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hukum Internasional Kelompok 7</title>
<style>
  @font-face{font-family:Fredoka;font-weight:400;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
  html,body{margin:0;padding:0;background:#A8DADC;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================================
   Video animasi kartun: HUKUM INTERNASIONAL & Kasus Sipadan-Ligitan
   Kelompok 7 - Kelas C - Fakultas Hukum Universitas Jember
   render(t) menggambar frame pada detik ke-t (deterministik).
   Akhir video menyambung mulus ke awal (untuk diputar berulang di booth).
   ========================================================================= */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = 'Fredoka, Inter, sans-serif';
const OL = '#1B263B';
/* palet (dipakai juga untuk leaflet & infografis) */
const C = {
  navy: '#1D3557', sea: '#457B9D', seaL: '#A8DADC', cream: '#F1FAEE', red: '#E63946',
  gold: '#FFB703', orange: '#FB8500', teal: '#2A9D8F', green: '#8AC926', sand: '#F4D9A6',
  white: '#FFFFFF', grey: '#B8C0CC', ink: OL, pink: '#FF9AA2', purple: '#8E7DBE',
  skin1: '#F1C27D', skin2: '#E0A877', skin3: '#C68B59'
};

/* ---------- waktu & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const pop = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pr = (t, a, d) => clamp((t - a) / d);
const vis = (t, a, b = 1e9, f = .5) => Math.min(eo((t - a) / f), eo((b - t) / f));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- primitif ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function paint(fill, lw = 5) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rbox(x, y, w, h, r, fill, lw = 5) { rr(x, y, w, h, r); paint(fill, lw); }
function circ(x, y, r, fill, lw = 5) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); paint(fill, lw); }
function ell(x, y, rx, ry, fill, lw = 5) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); paint(fill, lw); }
function limb(x1, y1, x2, y2, w, col) {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = OL; ctx.lineWidth = w + 9; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${o.w ?? 600} ${o.s ?? 36}px ${F}`;
  ctx.textAlign = o.al ?? 'left';
  ctx.textBaseline = o.bl ?? 'alphabetic';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc ?? OL; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.c ?? OL;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function lines(s, maxW, size, weight) {
  ctx.font = `${weight} ${size}px ${F}`;
  const out = [];
  for (const para of s.split('\n')) {
    let cur = '';
    for (const word of para.split(' ')) {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = word; } else cur = test;
    }
    out.push(cur);
  }
  return out;
}
function wrap(s, x, y, maxW, o = {}) {
  const size = o.s ?? 32, wt = o.w ?? 500, lh = o.lh ?? size * 1.25;
  const L = lines(s, maxW, size, wt);
  L.forEach((ln, i) => txt(ln, x, y + i * lh, { ...o, s: size, w: wt }));
  return L.length * lh;
}
function arrowC(x1, y1, x2, y2, col, w = 12, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const ang = Math.atan2(y2 - y1, x2 - x1), hd = w * 2.4;
  const ex = x2 - Math.cos(ang) * hd * .7, ey = y2 - Math.sin(ang) * hd * .7;
  limb(x1, y1, ex, ey, w, col);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - .55) * hd, y2 - Math.sin(ang - .55) * hd);
  ctx.lineTo(x2 - Math.cos(ang + .55) * hd, y2 - Math.sin(ang + .55) * hd);
  ctx.closePath(); paint(col, 4);
  ctx.restore();
}
function withA(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function at(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(); ctx.restore(); }
function card(x, y, w, h, fill = '#FFFFFF', r = 26) { rbox(x + 6, y + 8, w, h, r, 'rgba(0,0,0,.13)', 0); rbox(x, y, w, h, r, fill, 6); }
function pill(x, y, label, fill, o = {}) {
  const s = o.s || 26; ctx.font = `700 ${s}px ${F}`; const w = ctx.measureText(label).width + s * 1.4;
  const x0 = o.al === 'left' ? x : x - w / 2;
  rbox(x0, y - s * .95, w, s * 1.7, s * .85, fill, o.lw ?? 4);
  txt(label, x0 + w / 2, y + s * .35, { s, w: 700, al: 'center', c: o.c || OL });
  return w;
}
function checkBadge(x, y, s, col = C.teal) {
  at(x, y, s, () => { circ(0, 0, 30, col, 5); ctx.strokeStyle = '#FFF'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-3, 11); ctx.lineTo(14, -11); ctx.stroke(); });
}
function xBadge(x, y, s, col = C.red) {
  at(x, y, s, () => { circ(0, 0, 30, col, 5); ctx.strokeStyle = '#FFF'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-11, -11); ctx.lineTo(11, 11); ctx.moveTo(11, -11); ctx.lineTo(-11, 11); ctx.stroke(); });
}

/* ---------- latar ---------- */
function cloud(x, y, s) {
  at(x, y, s, () => {
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(-50, 10, 38, 0, TAU); ctx.arc(0, -12, 52, 0, TAU); ctx.arc(55, 8, 40, 0, TAU); ctx.fill();
    ctx.fillRect(-50, 10, 105, 38);
  });
}
function seaScene(t, hy = 560) {
  const g = ctx.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, '#8ECAE6'); g.addColorStop(1, '#DFF3FA');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy);
  at(1720, 150, 1, () => {
    ctx.save(); ctx.rotate(t * .25); ctx.fillStyle = 'rgba(255,183,3,.4)';
    for (let i = 0; i < 10; i++) { ctx.rotate(TAU / 10); ctx.fillRect(70, -8, 38, 16); }
    ctx.restore(); circ(0, 0, 58, C.gold, 0);
  });
  for (let i = 0; i < 3; i++) { const x = ((i * 700 + t * (12 + i * 5)) % (W + 500)) - 250; cloud(x, 130 + i * 70, .7 + i * .15); }
  const s = ctx.createLinearGradient(0, hy, 0, H);
  s.addColorStop(0, '#48A9C5'); s.addColorStop(1, '#1D6F96');
  ctx.fillStyle = s; ctx.fillRect(0, hy, W, H - hy);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let r = 0; r < 6; r++) for (let i = 0; i < 9; i++) {
    const y = hy + 40 + r * 85, x = ((i * 260 + r * 130 + t * (20 + r * 6)) % (W + 260)) - 130;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 22, y - 12, x + 44, y); ctx.quadraticCurveTo(x + 66, y + 12, x + 88, y); ctx.stroke();
  }
}
function paper(t, col = C.cream) {
  ctx.fillStyle = col; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(69,123,157,.10)';
  for (let x = 0; x < W + 80; x += 80) for (let y = 0; y < H + 80; y += 80) { ctx.beginPath(); ctx.arc(x + ((y / 80) % 2) * 40, y, 5, 0, TAU); ctx.fill(); }
}

/* ---------- properti ---------- */
function palm(x, gy, s, t) {
  at(x, gy, s, () => {
    ctx.lineCap = 'round';
    ctx.strokeStyle = OL; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -80, -6, -170); ctx.stroke();
    ctx.strokeStyle = '#A0703F'; ctx.lineWidth = 17; ctx.stroke();
    const sw = Math.sin(t * 1.6) * .08;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * .62 + sw;
      ctx.save(); ctx.translate(-6, -170); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(50, -26, 100, 12); ctx.quadraticCurveTo(50, 2, 0, 0); paint('#3FA34D', 4);
      ctx.restore();
    }
  });
}
function island(x, y, w, t, o = {}) {
  ell(x, y, w / 2, w * .13, C.sand, 5);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(x, y + w * .1, w / 2 + 24, 10, 0, 0, TAU); ctx.fill();
  if (o.palm !== false) palm(x - w * .15, y - w * .06, o.ps || .8, t);
  if (o.light) lighthouse(x + w * .22, y - w * .05, o.ls || .55, t);
  if (o.label) pill(x, y + w * .2 + 40, o.label, '#FFFFFF', { s: o.lsz || 30 });
}
function lighthouse(x, gy, s, t) {
  at(x, gy, s, () => {
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-26, -220); ctx.lineTo(26, -220); ctx.lineTo(40, 0); ctx.closePath(); paint('#FFFFFF', 5);
    ctx.save(); ctx.clip(); ctx.fillStyle = C.red; for (let i = 0; i < 3; i++) ctx.fillRect(-50, -40 - i * 70, 100, 30); ctx.restore();
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-26, -220); ctx.lineTo(26, -220); ctx.lineTo(40, 0); ctx.closePath(); paint(null, 5);
    rbox(-34, -270, 68, 52, 10, C.gold, 5);
    ctx.beginPath(); ctx.moveTo(-40, -270); ctx.lineTo(0, -310); ctx.lineTo(40, -270); ctx.closePath(); paint(C.red, 5);
    const a = Math.sin(t * 1.5) * .5;
    ctx.save(); ctx.globalAlpha *= .35; ctx.fillStyle = '#FFF3B0';
    ctx.beginPath(); ctx.moveTo(0, -244); ctx.lineTo(320 * Math.cos(a) , -244 - 60 + 320 * Math.sin(a) * .2); ctx.lineTo(320 * Math.cos(a), -244 + 60 + 320 * Math.sin(a) * .2); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}
function turtle(x, y, s, t) {
  at(x, y, s, () => {
    const f = Math.sin(t * 5) * .4;
    for (const [fx, fy, d] of [[-34, -22, -1], [34, -22, 1], [-30, 24, -1], [30, 24, 1]]) {
      ctx.save(); ctx.translate(fx, fy); ctx.rotate(d * (fy < 0 ? -.5 : .5) + f * d); ell(d * 16, 0, 22, 10, '#8AC926', 4); ctx.restore();
    }
    circ(0, -46, 16, '#8AC926', 4);
    circ(-6, -50, 3, OL, 0); circ(6, -50, 3, OL, 0);
    ell(0, 0, 40, 46, '#6A994E', 5);
    ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, -14); ctx.lineTo(20, -14); ctx.moveTo(-24, 12); ctx.lineTo(24, 12); ctx.moveTo(0, -40); ctx.lineTo(0, 40); ctx.stroke();
  });
}
function bird(x, y, s, t, col = '#FFFFFF') {
  at(x, y, s, () => {
    const w = Math.sin(t * 9) * 18;
    ctx.beginPath(); ctx.moveTo(-46, -w); ctx.quadraticCurveTo(-20, -24 - w * .3, 0, 0); ctx.quadraticCurveTo(20, -24 - w * .3, 46, -w);
    ctx.quadraticCurveTo(20, -8, 0, 8); ctx.quadraticCurveTo(-20, -8, -46, -w); paint(col, 4);
  });
}
function dove(x, y, s, t) {
  at(x, y, s, () => {
    const w = Math.sin(t * 7) * .25;
    ell(0, 0, 52, 30, '#FFFFFF', 5);
    circ(46, -18, 20, '#FFFFFF', 5);
    ctx.beginPath(); ctx.moveTo(62, -20); ctx.lineTo(80, -14); ctx.lineTo(62, -10); paint(C.orange, 3);
    circ(50, -22, 3.5, OL, 0);
    ctx.save(); ctx.rotate(w); ctx.beginPath(); ctx.moveTo(-10, -12); ctx.quadraticCurveTo(-40, -80, 10, -70); ctx.quadraticCurveTo(10, -30, 20, -10); paint('#FFFFFF', 5); ctx.restore();
    ctx.beginPath(); ctx.moveTo(-48, 0); ctx.lineTo(-84, -14); ctx.lineTo(-80, 18); ctx.closePath(); paint('#FFFFFF', 5);
    ctx.strokeStyle = '#3FA34D'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(78, -12); ctx.lineTo(100, 4); ctx.stroke();
    ell(92, -6, 9, 5, '#3FA34D', 2); ell(100, 10, 9, 5, '#3FA34D', 2);
  });
}
function scales(x, y, s, tilt = 0) {
  at(x, y, s, () => {
    limb(0, 70, 0, -60, 10, '#C9A227'); rbox(-50, 66, 100, 20, 8, '#C9A227', 4);
    ctx.save(); ctx.translate(0, -60); ctx.rotate(tilt);
    limb(-80, 0, 80, 0, 8, '#C9A227');
    for (const d of [-1, 1]) {
      ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(d * 80, 0); ctx.lineTo(d * 80 - 26, 56); ctx.moveTo(d * 80, 0); ctx.lineTo(d * 80 + 26, 56); ctx.stroke();
      ctx.beginPath(); ctx.arc(d * 80, 56, 32, 0, Math.PI); ctx.closePath(); paint('#F4D35E', 4);
    }
    ctx.restore();
    circ(0, -66, 10, C.gold, 4);
  });
}
function gear(x, y, r, n, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = i * Math.PI / n, rr_ = i % 2 ? r : r * 1.18; ctx.lineTo(Math.cos(a - .12) * rr_, Math.sin(a - .12) * rr_); ctx.lineTo(Math.cos(a + .12) * rr_, Math.sin(a + .12) * rr_); }
  ctx.closePath(); paint(col, 5);
  circ(0, 0, r * .55, '#FFFFFF', 5);
  ctx.restore();
}
function docIcon(x, y, s, col = '#FFFFFF', lines_ = 4) {
  at(x, y, s, () => {
    ctx.beginPath(); ctx.moveTo(-36, -46); ctx.lineTo(18, -46); ctx.lineTo(36, -28); ctx.lineTo(36, 46); ctx.lineTo(-36, 46); ctx.closePath(); paint(col, 5);
    ctx.fillStyle = C.grey; for (let i = 0; i < lines_; i++) ctx.fillRect(-22, -22 + i * 16, i === lines_ - 1 ? 28 : 44, 6);
  });
}
function scroll(x, y, s, label) {
  at(x, y, s, () => {
    rbox(-70, -50, 140, 100, 10, '#FFF3D6', 5);
    circ(-70, 0, 14, '#E9C98B', 4); circ(70, 0, 14, '#E9C98B', 4);
    ctx.fillStyle = C.grey; for (let i = 0; i < 3; i++) ctx.fillRect(-46, -22 + i * 18, 92, 6);
    if (label) txt(label, 0, 80, { s: 26, w: 700, al: 'center' });
  });
}
function gavel(x, y, s, ang = -.6) {
  at(x, y, s, () => { ctx.rotate(ang); limb(0, 0, 0, 80, 12, '#9C6644'); rbox(-44, -26, 88, 46, 12, '#B5835A', 5); });
}
function court(x, gy, s, label = 'MAHKAMAH INTERNASIONAL (ICJ)') {
  at(x, gy, s, () => {
    rbox(-260, -60, 520, 60, 6, '#E9E3D5', 5);
    ctx.beginPath(); ctx.moveTo(-290, -270); ctx.lineTo(0, -380); ctx.lineTo(290, -270); ctx.closePath(); paint('#D9CBB0', 6);
    rbox(-280, -280, 560, 30, 6, '#E9E3D5', 5);
    for (let i = 0; i < 6; i++) rbox(-235 + i * 88, -250, 34, 190, 6, '#FFFFFF', 4);
    scales(0, -315, .35, 0);
    pill(0, 50, label, C.navy, { s: 24, c: '#FFFFFF' });
  });
}
function flagID(x, y, w, h, t = 0) {
  const wv = k => Math.sin(t * 4 + k * 3) * h * .06;
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(0, wv(0)); ctx.quadraticCurveTo(w / 2, wv(.5) - 6, w, wv(1)); ctx.lineTo(w, h / 2 + wv(1)); ctx.quadraticCurveTo(w / 2, h / 2 + wv(.5) - 6, 0, h / 2 + wv(0)); ctx.closePath(); paint(C.red, 0);
  ctx.beginPath(); ctx.moveTo(0, h / 2 + wv(0)); ctx.quadraticCurveTo(w / 2, h / 2 + wv(.5) - 6, w, h / 2 + wv(1)); ctx.lineTo(w, h + wv(1)); ctx.quadraticCurveTo(w / 2, h + wv(.5) - 6, 0, h + wv(0)); ctx.closePath(); paint('#FFFFFF', 0);
  ctx.beginPath(); ctx.moveTo(0, wv(0)); ctx.quadraticCurveTo(w / 2, wv(.5) - 6, w, wv(1)); ctx.lineTo(w, h + wv(1)); ctx.quadraticCurveTo(w / 2, h + wv(.5) - 6, 0, h + wv(0)); ctx.closePath(); paint(null, 4);
  ctx.restore();
}
function flagMY(x, y, w, h) {
  ctx.save(); ctx.translate(x, y);
  rr(0, 0, w, h, 4); ctx.save(); ctx.clip();
  const n = 8; for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#FFFFFF' : '#CC0001'; ctx.fillRect(0, i * h / n, w, h / n + 1); }
  ctx.fillStyle = '#010066'; ctx.fillRect(0, 0, w * .5, h * 4 / n);
  const cx = w * .2, cy = h * 2 / n, r = h * .19;
  ctx.fillStyle = '#FFCC00'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#010066'; ctx.beginPath(); ctx.arc(cx + r * .3, cy, r * .85, 0, TAU); ctx.fill();
  ctx.fillStyle = '#FFCC00'; ctx.beginPath();
  for (let i = 0; i < 28; i++) { const a = -Math.PI / 2 + i * Math.PI / 14, rr_ = i % 2 ? r * .35 : r * .8; ctx.lineTo(w * .36 + Math.cos(a) * rr_, cy + Math.sin(a) * rr_); }
  ctx.fill();
  ctx.restore();
  rr(0, 0, w, h, 4); paint(null, 4);
  ctx.restore();
}
function flagPole(x, gy, h, kind, t, s = 1) {
  limb(x, gy, x, gy - h, 6 * s, '#DDDDDD');
  if (kind === 'ID') flagID(x + 3, gy - h, 110 * s, 74 * s, t); else flagMY(x + 3, gy - h, 110 * s, 74 * s);
}

/* ---------- tokoh ---------- */
function person(x, y, s, o, t) {
  o = Object.assign({ skin: C.skin1, shirt: C.teal, pants: '#3D5A80', hair: 'short', hairCol: '#3B2F2F',
    mood: 'happy', arm: 'down', walk: null, talk: false, flip: false, seed: 0 }, o);
  ctx.save(); ctx.translate(x, y); ctx.scale(o.flip ? -s : s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, 4, 50, 11, 0, 0, TAU); ctx.fill();
  const sw = o.walk == null ? 0 : Math.sin(o.walk);
  const bob = o.walk == null ? Math.sin(t * 2 + o.seed) * 1.5 : -Math.abs(Math.sin(o.walk)) * 7;
  ctx.translate(0, bob);
  limb(-15, -72, -15 + sw * 18, -8, 18, o.pants);
  limb(15, -72, 15 - sw * 18, -8, 18, o.pants);
  ell(-15 + sw * 18 - 4, -4, 17, 9, '#3A3A48', 4);
  ell(15 - sw * 18 + 4, -4, 17, 9, '#3A3A48', 4);
  const wv = Math.sin(t * 10 + o.seed) * 14;
  const P = {
    down: [[-48 - sw * 12, -74], [48 + sw * 12, -74]], wave: [[-48, -74], [72, -222 + wv]], point: [[-48, -74], [98, -152]],
    hold: [[-26, -104], [26, -104]], cheer: [[-74, -222 + wv * .5], [74, -222 - wv * .5]], think: [[-48, -74], [16, -158]],
    shrug: [[-82, -150], [82, -150]], pray: [[-10, -150], [10, -150]],
  }[o.arm];
  const hand = (hx, hy) => { limb(Math.sign(hx || 1) * 36, -128, hx, hy, 16, o.shirt); circ(hx, hy, 11, o.skin, 4); };
  hand(P[0][0], P[0][1]);

const SCENES = [{ d: 9, f: s0 }, { d: 22, f: s1 }, { d: 23, f: s2 }, { d: 16, f: s3 }, { d: 20, f: s4 }, { d: 66, f: s5 }, { d: 15, f: s6 }];
const KQ = (new URLSearchParams(location.search).get('k') || '').split(',').map(parseFloat);
let acc = 0; SCENES.forEach((s, i) => { s.k = KQ[i] > 0 ? KQ[i] : 1; s.dr = s.d * s.k; s.a = acc; acc += s.dr; });
const TOTAL = acc;
const LOOP = 1.8; // detik terakhir: lebur kembali ke frame pembuka
let SUBS = [];
window.setSubs = s => { SUBS = s; };

function subtitle(t) {
  const s = SUBS.find(x => t >= x[0] && t < x[1]);
  if (!s) return;
  const a = Math.min(eo((t - s[0]) / .2), eo((s[1] - t) / .2));
  withA(a, () => {
    const L = lines(s[2], 1600, 36, 500);
    const h = L.length * 46 + 26;
    let w = 0; ctx.font = `500 36px ${F}`; L.forEach(l => w = Math.max(w, ctx.measureText(l).width));
    rr(960 - w / 2 - 30, 1058 - h, w + 60, h, 22); ctx.fillStyle = 'rgba(27,38,59,.86)'; ctx.fill();
    L.forEach((l, i) => txt(l, 960, 1058 - h + 13 + 36 + i * 46 - 4, { s: 36, w: 500, c: '#FFFFFF', al: 'center' }));
  });
}

function render(t) {
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  const sc = SCENES.find(s => t >= s.a && t < s.a + s.dr) || SCENES[SCENES.length - 1];
  const lt = t - sc.a, last = sc === SCENES[SCENES.length - 1];
  ctx.save(); sc.f(lt / sc.k, sc.d); ctx.restore();
  // transisi masuk (tirai lingkaran), kecuali adegan pembuka
  if (sc !== SCENES[0] && lt < .45) {
    const k = eio(lt / .45);
    ctx.save(); ctx.fillStyle = C.gold; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(960, 540, 1150 * k, 0, TAU, true); ctx.fill(); ctx.restore();
  }
  // jembatan loop: detik-detik terakhir melebur ke frame pertama
  if (last && lt > sc.dr - LOOP) {
    const k = eio((lt - (sc.dr - LOOP)) / LOOP);
    ctx.save(); ctx.globalAlpha = k; SCENES[0].f(0, SCENES[0].d); ctx.restore();
  }
  subtitle(t);
}

window.TOTAL = TOTAL;
window.render = render;
window.ready = Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px Fredoka`)));
const qs = new URLSearchParams(location.search);
if (!qs.has('capture')) {
  window.ready.then(() => {
    if (qs.has('t')) render(parseFloat(qs.get('t')));
    else { const st = performance.now(); const loop = () => { render(((performance.now() - st) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
  });
}
</script>

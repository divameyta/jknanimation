<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasus Sipadan-Ligitan</title>
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
  @font-face{font-family:Lucky;font-weight:400;src:url(fonts/luckiest-guy-latin-400-normal.woff2) format('woff2')}
  html,body{margin:0;padding:0;background:#4FB3F0;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================================
   Video animasi: STUDI KASUS SIPADAN-LIGITAN (Indonesia/Malaysia)
   Kelompok 7 - PHI Kelas C - Fakultas Hukum Universitas Jember
   Gaya: langit biru cerah berawan, not musik melayang, huruf kartun tebal
   merah-biru-kuning, ikon ramah. Tanpa karakter/logo/kendaraan dari acara TV/film.
   render(t) deterministik; akhir video menyambung ke awal (loop).
   ========================================================================= */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = 'Fredoka, sans-serif', LK = 'Lucky, Fredoka, sans-serif';
const OL = '#14306B';
const C = {
  sky1: '#3FA9EE', sky2: '#BFE6FF', red: '#E8262D', blue: '#1F4FA3', yel: '#FFCE1F', navy: OL,
  green: '#43B649', orange: '#F7931E', sand: '#F6D79B', sea: '#2E9BD6', seaD: '#1C6FAF',
  white: '#FFFFFF', cream: '#FFF8E7', grey: '#B8C0CC', pink: '#FF9AA2', paper: '#FFF3D6'
};

/* ---------- waktu ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const pop = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pr = (t, a, d) => clamp((t - a) / d);
const vis = (t, a, b = 1e9, f = .4) => Math.min(eo((t - a) / f), eo((b - t) / f));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- primitif ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function paint(fill, lw = 5) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rbox(x, y, w, h, r, fill, lw = 5) { rr(x, y, w, h, r); paint(fill, lw); }
function circ(x, y, r, fill, lw = 5) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); paint(fill, lw); }
function ell(x, y, rx, ry, fill, lw = 5) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); paint(fill, lw); }
function limb(x1, y1, x2, y2, w, col) {
  ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = OL; ctx.lineWidth = w + 9; ctx.stroke(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function txt(s, x, y, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${o.w ?? 600} ${o.s ?? 36}px ${F}`; ctx.textAlign = o.al ?? 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = o.c ?? OL; ctx.fillText(s, x, y); ctx.restore();
}
/* huruf kartun tebal (judul) */
function toon(s, x, y, size, fill, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${size}px ${LK}`; ctx.textAlign = o.al ?? 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * .26; ctx.strokeStyle = OL; ctx.strokeText(s, x + size * .04, y + size * .07);
  ctx.strokeText(s, x, y);
  ctx.lineWidth = size * .08; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
/* kata berwarna-warni bergantian merah-biru-kuning */
function toonMulti(words, x, y, size, o = {}) {
  ctx.font = `${size}px ${LK}`;
  const sp = size * .28, ws = words.map(w => ctx.measureText(w).width);
  let tot = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = (o.al === 'left') ? x : x - tot / 2;
  const cols = o.cols || [C.red, C.blue, C.yel];
  words.forEach((w, i) => { toon(w, cx + ws[i] / 2, y + (o.wave ? Math.sin((o.t || 0) * 3 + i) * 5 : 0), size, cols[i % cols.length], { a: o.a }); cx += ws[i] + sp; });
}
function lines(s, maxW, size, weight, font = F) {
  ctx.font = `${weight} ${size}px ${font}`;
  const out = [];
  for (const para of s.split('\n')) {
    let cur = '';
    for (const word of para.split(' ')) {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = word; } else cur = test;
    }
    out.push(cur);
  }
  return out;
}
function wrap(s, x, y, maxW, o = {}) {
  const size = o.s ?? 32, wt = o.w ?? 500, lh = o.lh ?? size * 1.25;
  const L = lines(s, maxW, size, wt);
  L.forEach((ln, i) => txt(ln, x, y + i * lh, { ...o, s: size, w: wt }));
  return L.length * lh;
}
function withA(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function at(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(); ctx.restore(); }
function popIn(lt, st, x, y, fn, d = .5) { withA(eo(pr(lt, st, .25)), () => at(x, y, pop(pr(lt, st, d)), fn)); }
/* kartu bergaya undangan: bingkai biru tebal + garis putus merah */
function card(x, y, w, h, fill = '#FFFFFF', o = {}) {
  rbox(x + 7, y + 9, w, h, 30, 'rgba(20,48,107,.25)', 0);
  rbox(x, y, w, h, 30, o.frame || C.blue, 6);
  rbox(x + 12, y + 12, w - 24, h - 24, 22, fill, 4);
  if (!o.noDash) { ctx.save(); ctx.setLineDash([18, 12]); ctx.strokeStyle = C.red; ctx.lineWidth = 4; rr(x + 24, y + 24, w - 48, h - 48, 16); ctx.stroke(); ctx.restore(); }
}
function pill(x, y, label, fill, o = {}) {
  const s = o.s || 26; ctx.font = `700 ${s}px ${F}`; const w = ctx.measureText(label).width + s * 1.4;
  const x0 = o.al === 'left' ? x : x - w / 2;
  rbox(x0, y - s * .95, w, s * 1.7, s * .85, fill, o.lw ?? 4);
  txt(label, x0 + w / 2, y + s * .35, { s, w: 700, al: 'center', c: o.c || OL });
  return w;
}
function ribbon(x, y, w, label, fill = C.red, o = {}) {
  const h = o.h || 86;
  ctx.beginPath(); ctx.moveTo(x - w / 2 - 50, y - h / 2 + 18); ctx.lineTo(x - w / 2 + 6, y - h / 2 + 18); ctx.lineTo(x - w / 2 + 6, y + h / 2 + 18); ctx.lineTo(x - w / 2 - 50, y + h / 2 + 18); ctx.lineTo(x - w / 2 - 28, y + 18); ctx.closePath(); paint('#B51E24', 5);
  ctx.beginPath(); ctx.moveTo(x + w / 2 + 50, y - h / 2 + 18); ctx.lineTo(x + w / 2 - 6, y - h / 2 + 18); ctx.lineTo(x + w / 2 - 6, y + h / 2 + 18); ctx.lineTo(x + w / 2 + 50, y + h / 2 + 18); ctx.lineTo(x + w / 2 + 28, y + 18); ctx.closePath(); paint('#B51E24', 5);
  rbox(x - w / 2, y - h / 2, w, h, 14, fill, 6);
  ctx.font = `${o.s || 44}px ${LK}`;
  toon(label, x, y + (o.s || 44) * .38, o.s || 44, o.tc || C.yel);
}
function checkBadge(x, y, s, col = C.green) { at(x, y, s, () => { circ(0, 0, 30, col, 5); ctx.strokeStyle = '#FFF'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-3, 11); ctx.lineTo(14, -11); ctx.stroke(); }); }
function xBadge(x, y, s, col = C.red) { at(x, y, s, () => { circ(0, 0, 30, col, 5); ctx.strokeStyle = '#FFF'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-11, -11); ctx.lineTo(11, 11); ctx.moveTo(11, -11); ctx.lineTo(-11, 11); ctx.stroke(); }); }

/* ---------- latar: langit, awan, not musik ---------- */
function cloud(x, y, s, col = '#FFFFFF') {
  at(x, y, s, () => {
    ctx.fillStyle = 'rgba(20,48,107,.10)';
    ctx.beginPath(); ctx.arc(-60, 22, 44, 0, TAU); ctx.arc(0, 2, 60, 0, TAU); ctx.arc(64, 20, 46, 0, TAU); ctx.fill(); ctx.fillRect(-60, 22, 124, 46);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(-60, 12, 44, 0, TAU); ctx.arc(0, -10, 60, 0, TAU); ctx.arc(64, 10, 46, 0, TAU); ctx.fill(); ctx.fillRect(-60, 12, 124, 46);
  });
}
function note(x, y, s, col, kind = 0) {
  at(x, y, s, () => {
    ctx.fillStyle = col; ctx.strokeStyle = OL; ctx.lineWidth = 3;
    if (kind === 0) { ctx.beginPath(); ctx.ellipse(0, 0, 14, 10, -.4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillRect(10, -52, 5, 52); ctx.strokeRect(10, -52, 5, 52); ctx.beginPath(); ctx.moveTo(15, -52); ctx.quadraticCurveTo(34, -40, 28, -22); ctx.lineWidth = 5; ctx.strokeStyle = col; ctx.stroke(); }
    else { for (const dx of [0, 40]) { ctx.beginPath(); ctx.ellipse(dx, 0, 14, 10, -.4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillRect(dx + 10, -50, 5, 50); } ctx.fillRect(10, -54, 45, 10); ctx.strokeRect(10, -54, 45, 10); }
  });
}
function sky(t, o = {}) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.sky1); g.addColorStop(1, C.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // garis paranada (seperti latar khas langit bermusik)
  ctx.save(); ctx.globalAlpha = .25; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); for (let x = 0; x <= W; x += 40) { const y = 180 + i * 16 + Math.sin(x / 260 + t * .6) * 40; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  ctx.restore();
  const cy = o.cloudY ?? 0;
  for (let i = 0; i < 6; i++) {
    const sp = 10 + i * 4, x = ((i * 410 + t * sp) % (W + 400)) - 200;
    cloud(x, 140 + (i % 3) * 150 + cy, .8 + (i % 2) * .4);
  }
  if (!o.noNotes) for (let i = 0; i < 7; i++) {
    const p = ((t * .08 + hash(i) ) % 1);
    note(80 + i * 270 + Math.sin(t + i) * 30, H - p * (H + 120), .9, [C.red, C.yel, C.blue][i % 3], i % 2);
  }
}
function seaBand(t, top) {
  const s = ctx.createLinearGradient(0, top, 0, H);
  s.addColorStop(0, C.sea); s.addColorStop(1, C.seaD);
  ctx.fillStyle = s; ctx.fillRect(0, top, W, H - top);
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let r = 0; r < 6; r++) for (let i = 0; i < 9; i++) {
    const y = top + 40 + r * 80, x = ((i * 260 + r * 130 + t * (20 + r * 6)) % (W + 260)) - 130;
    if (y > H) continue;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 22, y - 12, x + 44, y); ctx.quadraticCurveTo(x + 66, y + 12, x + 88, y); ctx.stroke();
  }
}

/* ---------- ikon ramah ---------- */
function palm(x, gy, s, t) {
  at(x, gy, s, () => {
    ctx.lineCap = 'round'; ctx.strokeStyle = OL; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -80, -6, -170); ctx.stroke();
    ctx.strokeStyle = '#A0703F'; ctx.lineWidth = 17; ctx.stroke();
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .62 + Math.sin(t * 1.6) * .08; ctx.save(); ctx.translate(-6, -170); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(50, -26, 100, 12); ctx.quadraticCurveTo(50, 2, 0, 0); paint(C.green, 4); ctx.restore(); }
  });
}
function lighthouse(x, gy, s, t, lit = true) {
  at(x, gy, s, () => {
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-26, -220); ctx.lineTo(26, -220); ctx.lineTo(40, 0); ctx.closePath(); paint('#FFFFFF', 5);
    ctx.save(); ctx.clip(); ctx.fillStyle = C.red; for (let i = 0; i < 3; i++) ctx.fillRect(-50, -40 - i * 70, 100, 30); ctx.restore();
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-26, -220); ctx.lineTo(26, -220); ctx.lineTo(40, 0); ctx.closePath(); paint(null, 5);
    rbox(-34, -270, 68, 52, 10, lit ? C.yel : '#DDD', 5);
    ctx.beginPath(); ctx.moveTo(-40, -270); ctx.lineTo(0, -310); ctx.lineTo(40, -270); ctx.closePath(); paint(C.red, 5);
    if (lit) { const a = Math.sin(t * 1.5) * .5; ctx.save(); ctx.globalAlpha *= .4; ctx.fillStyle = '#FFF3B0'; ctx.beginPath(); ctx.moveTo(0, -244); ctx.lineTo(320 * Math.cos(a), -304 + 64 * Math.sin(a)); ctx.lineTo(320 * Math.cos(a), -184 + 64 * Math.sin(a)); ctx.closePath(); ctx.fill(); ctx.restore(); }
  });
}
function island(x, y, w, t, o = {}) {
  ell(x, y, w / 2, w * .13, C.sand, 5);
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x, y + w * .1, w / 2 + 24, 10, 0, 0, TAU); ctx.fill();
  if (o.palm !== false) palm(x - w * .15, y - w * .06, o.ps || .8, t);
  if (o.light) lighthouse(x + w * .22, y - w * .05, o.ls || .55, t, o.lit !== false);
  if (o.label) pill(x, y + w * .2 + 34, o.label, '#FFFFFF', { s: o.lsz || 30 });
}
function turtle(x, y, s, t) {
  at(x, y, s, () => {
    const f = Math.sin(t * 5) * .4;
    for (const [fx, fy, d] of [[-34, -22, -1], [34, -22, 1], [-30, 24, -1], [30, 24, 1]]) { ctx.save(); ctx.translate(fx, fy); ctx.rotate(d * (fy < 0 ? -.5 : .5) + f * d); ell(d * 16, 0, 22, 10, '#8AC926', 4); ctx.restore(); }
    circ(0, -46, 16, '#8AC926', 4); circ(-6, -50, 3, OL, 0); circ(6, -50, 3, OL, 0);
    ell(0, 0, 40, 46, '#6A994E', 5);
    ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, -14); ctx.lineTo(20, -14); ctx.moveTo(-24, 12); ctx.lineTo(24, 12); ctx.moveTo(0, -40); ctx.lineTo(0, 40); ctx.stroke();
  });
}
function bird(x, y, s, t, col = '#FFFFFF') {
  at(x, y, s, () => { const w = Math.sin(t * 9) * 18; ctx.beginPath(); ctx.moveTo(-46, -w); ctx.quadraticCurveTo(-20, -24 - w * .3, 0, 0); ctx.quadraticCurveTo(20, -24 - w * .3, 46, -w); ctx.quadraticCurveTo(20, -8, 0, 8); ctx.quadraticCurveTo(-20, -8, -46, -w); paint(col, 4); });
}
function globe(x, y, s, t, o = {}) {
  at(x, y, s, () => {
    circ(0, 0, 105, '#4CC9F0', 6);
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 102, 0, TAU); ctx.clip();
    const off = (t * 30) % 220; ctx.fillStyle = '#80ED99';
    for (const bx of [-220, 0, 220]) { ctx.beginPath(); ctx.ellipse(bx - 50 + off, -50, 46, 32, .4, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(bx + 40 + off, 30, 34, 52, -.3, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(bx - 70 + off, 60, 26, 20, 0, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; for (const r of [-50, 0, 50]) { ctx.beginPath(); ctx.ellipse(0, r, 104 * Math.sqrt(1 - (r / 105) ** 2), 10, 0, 0, TAU); ctx.stroke(); }
    ctx.restore(); circ(0, 0, 105, null, 6);
    if (o.face !== false) {
      const bl = (t % 3.4) < .12;
      if (bl) { ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-44, -20); ctx.lineTo(-20, -20); ctx.moveTo(20, -20); ctx.lineTo(44, -20); ctx.stroke(); }
      else { circ(-32, -20, 15, '#FFFFFF', 4); circ(32, -20, 15, '#FFFFFF', 4); circ(-29, -18, 7, OL, 0); circ(35, -18, 7, OL, 0); }
      ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 16, 26, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,120,.45)'; ctx.beginPath(); ctx.arc(-60, 14, 12, 0, TAU); ctx.arc(60, 14, 12, 0, TAU); ctx.fill();
    }
  });
}
function scales(x, y, s, tilt = 0) {
  at(x, y, s, () => {
    limb(0, 70, 0, -60, 10, '#E0B12F'); rbox(-50, 66, 100, 20, 8, '#E0B12F', 4);
    ctx.save(); ctx.translate(0, -60); ctx.rotate(tilt); limb(-80, 0, 80, 0, 8, '#E0B12F');
    for (const d of [-1, 1]) { ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(d * 80, 0); ctx.lineTo(d * 80 - 26, 56); ctx.moveTo(d * 80, 0); ctx.lineTo(d * 80 + 26, 56); ctx.stroke(); ctx.beginPath(); ctx.arc(d * 80, 56, 32, 0, Math.PI); ctx.closePath(); paint(C.yel, 4); }
    ctx.restore(); circ(0, -66, 10, C.yel, 4);
  });
}
function gavel(x, y, s, ang = -.6) { at(x, y, s, () => { ctx.rotate(ang); limb(0, 0, 0, 80, 12, '#9C6644'); rbox(-44, -26, 88, 46, 12, '#B5835A', 5); rbox(-50, -22, 10, 38, 4, C.yel, 3); rbox(40, -22, 10, 38, 4, C.yel, 3); }); }
function scroll(x, y, s, label) {
  at(x, y, s, () => { rbox(-70, -50, 140, 100, 10, C.paper, 5); circ(-70, 0, 14, '#E9C98B', 4); circ(70, 0, 14, '#E9C98B', 4); ctx.fillStyle = C.grey; for (let i = 0; i < 3; i++) ctx.fillRect(-46, -22 + i * 18, 92, 6); if (label) txt(label, 0, 80, { s: 26, w: 700, al: 'center' }); });
}
function docIcon(x, y, s, label) {
  at(x, y, s, () => {
    ctx.beginPath(); ctx.moveTo(-60, -76); ctx.lineTo(34, -76); ctx.lineTo(60, -50); ctx.lineTo(60, 76); ctx.lineTo(-60, 76); ctx.closePath(); paint(C.paper, 5);
    if (label) { wrap(label, -48, -40, 100, { s: 18, w: 700, lh: 21 }); }
    ctx.fillStyle = C.grey; for (let i = 0; i < 3; i++) ctx.fillRect(-46, 18 + i * 16, 92, 6);
    circ(30, 56, 14, C.red, 3);
  });
}
function crown(x, y, s) {
  at(x, y, s, () => { ctx.beginPath(); ctx.moveTo(-60, 30); ctx.lineTo(-60, -30); ctx.lineTo(-30, 0); ctx.lineTo(0, -44); ctx.lineTo(30, 0); ctx.lineTo(60, -30); ctx.lineTo(60, 30); ctx.closePath(); paint(C.yel, 5); for (const [cx, cc] of [[-30, C.red], [0, C.blue], [30, C.red]]) circ(cx, 14, 8, cc, 3); });
}
function magnifier(x, y, s) { at(x, y, s, () => { limb(30, 30, 72, 72, 16, '#9C6644'); circ(0, 0, 48, 'rgba(191,230,255,.6)', 10); }); }
function balloon(x, y, s, t) {
  at(x, y + Math.sin(t * 1.2) * 12, s, () => {
    ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-34, 60); ctx.lineTo(-20, 110); ctx.moveTo(34, 60); ctx.lineTo(20, 110); ctx.stroke();
    rbox(-26, 108, 52, 38, 8, '#B5835A', 4);
    ctx.beginPath(); ctx.moveTo(0, 74); ctx.bezierCurveTo(-100, 20, -90, -100, 0, -100); ctx.bezierCurveTo(90, -100, 100, 20, 0, 74); ctx.closePath();
    ctx.save(); ctx.clip(); const cols = [C.red, C.yel, C.blue, C.yel, C.red]; for (let i = 0; i < 5; i++) { ctx.fillStyle = cols[i]; ctx.fillRect(-100 + i * 40, -110, 40, 190); } ctx.restore();
    ctx.beginPath(); ctx.moveTo(0, 74); ctx.bezierCurveTo(-100, 20, -90, -100, 0, -100); ctx.bezierCurveTo(90, -100, 100, 20, 0, 74); ctx.closePath(); paint(null, 5);
  });
}
function plane(x, y, s, ang = 0) {
  at(x, y, s, () => { ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(-32, -24); ctx.lineTo(-16, 0); ctx.lineTo(-32, 24); ctx.closePath(); paint('#FFFFFF', 4); ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(-16, 0); ctx.lineTo(-24, 14); ctx.closePath(); paint('#DCEBFF', 3); });
}

/* dinding awan untuk menyambung akhir -> awal */
function cloudWall(k) {
  // k: 0 = belum masuk, 1 = menutup penuh
  const x0 = lerp(W + 200, -200, k);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(x0 + 140, 0, W + 400, H);
  for (let i = 0; i < 8; i++) { const y = i * 150 + 20; ctx.beginPath(); ctx.arc(x0 + 120, y, 120 + (i % 2) * 40, 0, TAU); ctx.fill(); }
}

/* ---------- jadwal & render ---------- */
const FN = [a1, a2, a3, a4, a5, a6, a7, a8];
const XFER = 1.6; // detik terakhir: awan menyapu, lalu terbuka ke adegan 1

function subtitle(t) {
  const s = SUBS.find(x => t >= x[0] && t < x[1]);
  if (!s) return;
  const a = Math.min(eo((t - s[0]) / .15), eo((s[1] - t) / .15));
  withA(a, () => {
    const L = lines(s[2], 1640, 36, 600);
    const h = L.length * 46 + 26;
    let w = 0; ctx.font = `600 36px ${F}`; L.forEach(l => w = Math.max(w, ctx.measureText(l).width));
    rr(960 - w / 2 - 30, 1060 - h, w + 60, h, 22); ctx.fillStyle = 'rgba(20,48,107,.9)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = C.yel; ctx.stroke();
    L.forEach((l, i) => txt(l, 960, 1060 - h + 13 + 36 + i * 46 - 4, { s: 36, w: 600, c: '#FFFFFF', al: 'center' }));
  });
}
function drawScene(i, lt) { CUES = TIM.adegan[i].cue || []; ctx.save(); FN[i](lt, TIM.adegan[i].dur); ctx.restore(); }

function render(t) {
  const T = TIM.total;
  t = ((t % T) + T) % T;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.sky1; ctx.fillRect(0, 0, W, H);
  let i = TIM.adegan.findIndex(a => t >= a.mulai && t < a.mulai + a.dur); if (i < 0) i = 7;
  const A = TIM.adegan[i], lt = t - A.mulai;
  const last = i === 7;
  if (last && lt > A.dur - XFER) {
    const k = (lt - (A.dur - XFER)) / XFER;
    if (k < .5) { drawScene(7, lt); cloudWall(eio(k * 2)); }
    else { drawScene(0, 0); ctx.save(); ctx.translate(-lerp(0, W + 600, eio((k - .5) * 2)), 0); cloudWall(1); ctx.restore(); }
  } else {
    drawScene(i, lt);
    // transisi antaradegan: awan berpendar singkat
    if (i > 0 && lt < .4) { ctx.save(); ctx.globalAlpha = 1 - eo(lt / .4); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
  subtitle(t);
}

window.render = render;
Object.defineProperty(window, 'TOTAL', { get: () => TIM.total });
window.ready = Promise.all([...[500, 600, 700].map(w => document.fonts.load(`${w} 40px Fredoka`)), document.fonts.load('40px Lucky'),
  new Promise(r => { if (QR.complete) r(); else { QR.onload = r; QR.onerror = r; } })]);
const qs = new URLSearchParams(location.search);
if (!qs.has('capture')) {
  window.ready.then(() => {
    if (qs.has('t')) render(parseFloat(qs.get('t')));
    else { const st = performance.now(); const loop = () => { render(((performance.now() - st) / 1000) % TIM.total); requestAnimationFrame(loop); }; loop(); }
  });
}

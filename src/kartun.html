<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartun Solusi PBI JKN</title>
<style>
  @font-face{font-family:Fredoka;font-weight:400;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
  html,body{margin:0;padding:0;background:#BDE8FF;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================================
   Video animasi KARTUN: Solusi atas Penonaktifan Peserta PBI JK 2026
   Kelompok 2 - Hukum Telematika Kelas E - FH Universitas Jember
   render(t) menggambar frame pada detik ke-t (deterministik).
   ========================================================================= */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = 'Fredoka, Inter, sans-serif';
const OL = '#2B2D42';
const C = {
  teal: '#2EC4B6', tealD: '#1A9C90', red: '#EF476F', yellow: '#FFD166', orange: '#F4A259',
  blue: '#118AB2', blueL: '#73C2FB', purple: '#8E7DBE', green: '#6BCB77', greenD: '#3FA34D',
  cream: '#FFF8EC', white: '#FFFFFF', grey: '#B8C0CC', greyD: '#7D8597', ink: OL, pink: '#FF9AA2',
  skin1: '#F1C27D', skin2: '#E0A877', skin3: '#C68B59', sky1: '#9AD8FF', sky2: '#E3F6FF'
};

/* ---------- waktu & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const pop = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pr = (t, a, d) => clamp((t - a) / d);
const vis = (t, a, b = 1e9, f = .5) => Math.min(eo((t - a) / f), eo((b - t) / f));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- primitif ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function paint(fill, lw = 5) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rbox(x, y, w, h, r, fill, lw = 5) { rr(x, y, w, h, r); paint(fill, lw); }
function circ(x, y, r, fill, lw = 5) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); paint(fill, lw); }
function ell(x, y, rx, ry, fill, lw = 5) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); paint(fill, lw); }
function limb(x1, y1, x2, y2, w, col) {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = OL; ctx.lineWidth = w + 9; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${o.w ?? 600} ${o.s ?? 36}px ${F}`;
  ctx.textAlign = o.al ?? 'left';
  ctx.textBaseline = o.bl ?? 'alphabetic';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc ?? OL; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.c ?? OL;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function lines(s, maxW, size, weight) {
  ctx.font = `${weight} ${size}px ${F}`;
  const out = [];
  for (const para of s.split('\n')) {
    let cur = '';
    for (const word of para.split(' ')) {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = word; } else cur = test;
    }
    out.push(cur);
  }
  return out;
}
function wrap(s, x, y, maxW, o = {}) {
  const size = o.s ?? 32, wt = o.w ?? 500, lh = o.lh ?? size * 1.25;
  const L = lines(s, maxW, size, wt);
  L.forEach((ln, i) => txt(ln, x, y + i * lh, { ...o, s: size, w: wt }));
  return L.length * lh;
}
function arrowC(x1, y1, x2, y2, col, w = 12, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const ang = Math.atan2(y2 - y1, x2 - x1), hd = w * 2.4;
  const ex = x2 - Math.cos(ang) * hd * .7, ey = y2 - Math.sin(ang) * hd * .7;
  limb(x1, y1, ex, ey, w, col);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - .55) * hd, y2 - Math.sin(ang - .55) * hd);
  ctx.lineTo(x2 - Math.cos(ang + .55) * hd, y2 - Math.sin(ang + .55) * hd);
  ctx.closePath(); paint(col, 4);
  ctx.restore();
}
function withA(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function at(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(); ctx.restore(); }

/* ---------- latar ---------- */
function cloud(x, y, s) {
  at(x, y, s, () => {
    ctx.beginPath();
    ctx.arc(-50, 10, 38, 0, TAU); ctx.arc(0, -12, 52, 0, TAU); ctx.arc(55, 8, 40, 0, TAU);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.fillRect(-50, 10, 105, 38);
  });
}
function sky(t, gy = 860, opts = {}) {
  const g = ctx.createLinearGradient(0, 0, 0, gy);
  g.addColorStop(0, C.sky1); g.addColorStop(1, C.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // matahari
  if (!opts.noSun) at(1780, 120, 1, () => {
    ctx.save(); ctx.rotate(t * .25);
    ctx.fillStyle = 'rgba(255,209,102,.45)';
    for (let i = 0; i < 10; i++) { ctx.rotate(TAU / 10); ctx.fillRect(70, -8, 38, 16); }
    ctx.restore();
    circ(0, 0, 58, C.yellow, 0);
  });
  // awan
  for (let i = 0; i < 4; i++) {
    const sp = 14 + i * 6, x = ((i * 520 + t * sp) % (W + 500)) - 250;
    cloud(x, 120 + (i % 2) * 90 + i * 12, .7 + (i % 3) * .2);
  }
  // bukit
  ctx.fillStyle = '#A8E0A0';
  ctx.beginPath(); ctx.ellipse(380, gy + 40, 620, 190, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#93D68A';
  ctx.beginPath(); ctx.ellipse(1500, gy + 60, 760, 230, 0, Math.PI, TAU); ctx.fill();
  // tanah
  ctx.fillStyle = '#7CC96F'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#6DBB61'; ctx.fillRect(0, gy, W, 10);
}
function paper(t) {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(46,196,182,.10)';
  for (let x = 0; x < W + 80; x += 80) for (let y = 0; y < H + 80; y += 80) {
    ctx.beginPath(); ctx.arc(x + ((y / 80) % 2) * 40, y, 5, 0, TAU); ctx.fill();
  }
}
function tree(x, gy, s) {
  at(x, gy, s, () => {
    rbox(-14, -110, 28, 112, 8, '#9C6644', 4);
    circ(0, -150, 70, '#57B65F', 5); circ(-45, -120, 45, '#57B65F', 5); circ(45, -118, 48, '#57B65F', 5);
    circ(0, -150, 66, '#57B65F', 0); circ(-45, -120, 41, '#57B65F', 0); circ(45, -118, 44, '#57B65F', 0);
  });
}

/* ---------- tokoh ---------- */
const DARMO = { skin: C.skin2, shirt: C.orange, pants: '#4A5A7A', hair: 'short', hairCol: '#5B5B5B', mustache: true };
const SARI = { skin: C.skin1, shirt: C.teal, pants: '#355070', hair: 'hijab', hairCol: '#8E7DBE' };
const NURSE = { skin: C.skin1, shirt: '#FFFFFF', pants: '#73C2FB', hair: 'nurse', hairCol: '#3B2F2F' };
function person(x, y, s, o, t) {
  o = Object.assign({ skin: C.skin1, shirt: C.teal, pants: '#3D5A80', hair: 'short', hairCol: '#3B2F2F',
    mood: 'happy', arm: 'down', walk: null, talk: false, flip: false, seed: 0 }, o);
  ctx.save(); ctx.translate(x, y); ctx.scale(o.flip ? -s : s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, 4, 50, 11, 0, 0, TAU); ctx.fill();
  const sw = o.walk == null ? 0 : Math.sin(o.walk);
  const bob = o.walk == null ? Math.sin(t * 2 + o.seed) * 1.5 : -Math.abs(Math.sin(o.walk)) * 7;
  ctx.translate(0, bob);
  // kaki
  limb(-15, -72, -15 + sw * 18, -8, 18, o.pants);
  limb(15, -72, 15 - sw * 18, -8, 18, o.pants);
  ell(-15 + sw * 18 - 4, -4, 17, 9, '#3A3A48', 4);
  ell(15 - sw * 18 + 4, -4, 17, 9, '#3A3A48', 4);
  // pose tangan
  const wv = Math.sin(t * 10 + o.seed) * 14;
  const P = {
    down: [[-48 - sw * 12, -74], [48 + sw * 12, -74]],
    wave: [[-48, -74], [72, -222 + wv]],
    point: [[-48, -74], [98, -152]],
    phone: [[-48, -74], [26, -122]],
    hold: [[-26, -104], [26, -104]],
    cheer: [[-74, -222 + wv * .5], [74, -222 - wv * .5]],
    think: [[-48, -74], [16, -158]],
    shrug: [[-82, -150], [82, -150]],
    stop: [[-48, -74], [92, -170]],
  }[o.arm];
  const hand = (hx, hy) => { limb(o.arm === 'down' || o.arm === 'phone' ? Math.sign(hx) * 36 : Math.sign(hx) * 36, -128, hx, hy, 16, o.shirt); circ(hx, hy, 11, o.skin, 4); };
  hand(P[0][0], P[0][1]);
  // badan
  if (o.cape) { ctx.beginPath(); ctx.moveTo(-36, -140); ctx.quadraticCurveTo(-58 - Math.sin(t * 4) * 8, -60, -50, -30); ctx.lineTo(50, -30); ctx.quadraticCurveTo(58 + Math.sin(t * 4) * 8, -60, 36, -140); ctx.closePath(); paint(o.cape, 5); }
  rbox(-40, -148, 80, 88, 30, o.shirt, 5);
  if (o.tie) { ctx.beginPath(); ctx.moveTo(0, -142); ctx.lineTo(9, -128); ctx.lineTo(0, -96); ctx.lineTo(-9, -128); ctx.closePath(); paint(o.tie, 3); }
  if (o.emblem) { circ(0, -108, 20, C.yellow, 4); txt(o.emblem, 0, -101, { s: 16, w: 700, al: 'center' }); }
  if (o.label) {
    ctx.save(); ctx.translate(0, -bob); if (o.flip) ctx.scale(-1, 1);
    ctx.font = `700 24px ${F}`; const lw = ctx.measureText(o.label).width + 26;
    rbox(-lw / 2, 16, lw, 38, 19, '#FFFFFF', 4); txt(o.label, 0, 44, { s: 24, w: 700, al: 'center' });
    ctx.restore();
  }
  if (o.cross) { ctx.fillStyle = C.red; ctx.fillRect(-22, -126, 14, 4); ctx.fillRect(-17, -131, 4, 14); }
  hand(P[1][0], P[1][1]);
  if (o.arm === 'phone') { rbox(12, -168, 34, 56, 8, '#2B2D42', 4); rbox(16, -162, 26, 42, 4, o.phoneScreen || C.blueL, 0); }
  if (o.arm === 'hold' && o.prop !== 'none') { rbox(-30, -138, 60, 44, 6, '#FFFFFF', 4); ctx.fillStyle = C.grey; for (let i = 0; i < 3; i++) ctx.fillRect(-20, -128 + i * 11, 40, 5); }
  // kepala
  const hx = 0, hy = -196;
  if (o.hair === 'hijab') { circ(hx, hy + 2, 56, o.hairCol, 5); rbox(-52, hy + 10, 104, 62, 26, o.hairCol, 5); circ(hx, hy + 2, 54, o.hairCol, 0); }
  if (o.hair === 'long') { rbox(-52, hy - 30, 104, 110, 44, o.hairCol, 5); }
  circ(hx, hy, o.hair === 'hijab' ? 40 : 46, o.skin, 5);
  if (o.hair === 'short' || o.hair === 'long') { ctx.beginPath(); ctx.arc(hx, hy - 2, 48, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(hx, hy - 26, hx - 46, hy - 10); ctx.closePath(); paint(o.hairCol, 5); }
  if (o.hair === 'cap') { ctx.beginPath(); ctx.arc(hx, hy - 8, 48, Math.PI, TAU); ctx.closePath(); paint(o.hairCol, 5); rbox(hx, hy - 16, 62, 14, 7, o.hairCol, 4); }
  if (o.hair === 'nurse') { ctx.beginPath(); ctx.arc(hx, hy - 2, 48, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); paint(o.hairCol, 5); rbox(hx - 30, hy - 66, 60, 26, 8, '#FFFFFF', 4); ctx.fillStyle = C.red; ctx.fillRect(hx - 3, hy - 62, 6, 18); ctx.fillRect(hx - 9, hy - 56, 18, 6); }
  if (o.hair === 'bald') { ctx.beginPath(); ctx.arc(hx - 40, hy - 4, 12, 0, TAU); ctx.arc(hx + 40, hy - 4, 12, 0, TAU); ctx.fillStyle = o.hairCol; ctx.fill(); }
  if (o.mask) { ctx.fillStyle = '#2B2D42'; ctx.fillRect(hx - 44, hy - 14, 88, 22); }
  // wajah
  const blink = ((t + o.seed * 1.7) % 3.9) < .13;
  const ey = hy - 4, ex = 15;
  ctx.fillStyle = OL; ctx.strokeStyle = OL; ctx.lineWidth = 4; ctx.lineCap = 'round';
  if (o.mood === 'shock') {
    circ(hx - ex, ey, 9, '#FFFFFF', 3); circ(hx + ex, ey, 9, '#FFFFFF', 3);
    circ(hx - ex, ey, 4, OL, 0); circ(hx + ex, ey, 4, OL, 0);
  } else if (blink || o.mood === 'sleep') {
    ctx.beginPath(); ctx.moveTo(hx - ex - 6, ey); ctx.lineTo(hx - ex + 6, ey); ctx.moveTo(hx + ex - 6, ey); ctx.lineTo(hx + ex + 6, ey); ctx.stroke();
  } else {
    circ(hx - ex, ey, o.mask ? 4 : 5.5, o.mask ? '#FFFFFF' : OL, 0); circ(hx + ex, ey, o.mask ? 4 : 5.5, o.mask ? '#FFFFFF' : OL, 0);
  }
  ctx.strokeStyle = OL; ctx.lineWidth = 4;
  if (o.mood === 'sad' || o.mood === 'worried') {
    ctx.beginPath(); ctx.moveTo(hx - ex - 9, ey - 12); ctx.lineTo(hx - ex + 6, ey - 17); ctx.moveTo(hx + ex + 9, ey - 12); ctx.lineTo(hx + ex - 6, ey - 17); ctx.stroke();
  }
  if (o.mood === 'shock') { ctx.beginPath(); ctx.moveTo(hx - ex - 8, ey - 18); ctx.lineTo(hx - ex + 7, ey - 20); ctx.moveTo(hx + ex + 8, ey - 18); ctx.lineTo(hx + ex - 7, ey - 20); ctx.stroke(); }
  if (o.mood === 'sly') { ctx.beginPath(); ctx.moveTo(hx - ex - 9, ey - 16); ctx.lineTo(hx - ex + 6, ey - 10); ctx.moveTo(hx + ex + 9, ey - 16); ctx.lineTo(hx + ex - 6, ey - 10); ctx.stroke(); }
  // pipi
  if (o.mood === 'happy') { ctx.fillStyle = 'rgba(255,120,120,.35)'; ctx.beginPath(); ctx.arc(hx - 28, hy + 12, 8, 0, TAU); ctx.arc(hx + 28, hy + 12, 8, 0, TAU); ctx.fill(); }
  // kumis
  if (o.mustache) { ctx.fillStyle = '#4A4A4A'; ctx.beginPath(); ctx.ellipse(hx - 8, hy + 14, 10, 5, .3, 0, TAU); ctx.ellipse(hx + 8, hy + 14, 10, 5, -.3, 0, TAU); ctx.fill(); }
  if (o.glasses) { ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hx - ex, ey, 11, 0, TAU); ctx.moveTo(hx + ex + 11, ey); ctx.arc(hx + ex, ey, 11, 0, TAU); ctx.moveTo(hx - 4, ey); ctx.lineTo(hx + 4, ey); ctx.stroke(); }
  // mulut
  const my = hy + 24;
  ctx.lineWidth = 4;
  if (o.talk && Math.sin(t * 15 + o.seed) > -.2) { ell(hx, my, 9, 4 + Math.abs(Math.sin(t * 15 + o.seed)) * 6, '#8C2F39', 3); }
  else if (o.mood === 'happy') { ctx.beginPath(); ctx.arc(hx, my - 8, 13, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
  else if (o.mood === 'sad') { ctx.beginPath(); ctx.arc(hx, my + 8, 11, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
  else if (o.mood === 'shock') { ell(hx, my, 9, 12, '#8C2F39', 3); }
  else if (o.mood === 'worried') { ctx.beginPath(); ctx.moveTo(hx - 12, my); ctx.quadraticCurveTo(hx - 6, my - 6, hx, my); ctx.quadraticCurveTo(hx + 6, my + 6, hx + 12, my); ctx.stroke(); }
  else if (o.mood === 'sly') { ctx.beginPath(); ctx.moveTo(hx - 12, my); ctx.quadraticCurveTo(hx, my + 6, hx + 14, my - 6); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(hx - 9, my); ctx.lineTo(hx + 9, my); ctx.stroke(); }
  ctx.restore();
}
/* tanda di atas kepala */
function mark(x, y, ch, col, t) {
  const b = Math.sin(t * 6) * 6;
  txt(ch, x, y + b, { s: 80, w: 700, c: col, al: 'center', stroke: 10, sc: '#FFFFFF' });
  txt(ch, x, y + b, { s: 80, w: 700, c: col, al: 'center' });
}
/* ponsel berwajah: maskot Mobile JKN (generik) */
function phoneBuddy(x, y, s, t, o = {}) {
  at(x, y, s, () => {
    const hop = o.ring ? Math.abs(Math.sin(t * 8)) * -10 : 0;
    ctx.translate(0, hop);
    ctx.rotate(o.ring ? Math.sin(t * 22) * .06 : 0);
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, 132 - hop, 60, 12, 0, 0, TAU); ctx.fill();
    limb(-24, 100, -30, 128, 12, '#3D5A80'); limb(24, 100, 30, 128, 12, '#3D5A80');
    if (o.wave) limb(70, 0, 110, -60 + Math.sin(t * 10) * 10, 12, '#3D5A80'); else limb(70, 10, 96, 50, 12, '#3D5A80');
    limb(-70, 10, -96, 50, 12, '#3D5A80');
    rbox(-75, -120, 150, 230, 30, '#3D5A80', 6);
    rbox(-62, -100, 124, 180, 18, o.screen || '#E3F6FF', 4);
    const sleep = o.sleep;
    if (sleep) {
      ctx.strokeStyle = OL; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-34, -30); ctx.lineTo(-14, -30); ctx.moveTo(14, -30); ctx.lineTo(34, -30); ctx.stroke();
      ell(0, 10, 10, 6, '#8C2F39', 3);
      const z = (t * .8) % 1;
      txt('z', 70 + z * 30, -110 - z * 60, { s: 40 + z * 16, w: 700, c: C.blue, a: 1 - z });
      txt('z', 50 + ((z + .5) % 1) * 30, -110 - ((z + .5) % 1) * 60, { s: 34, w: 700, c: C.blue, a: 1 - (z + .5) % 1 });
    } else {
      const bl = (t % 3.3) < .12;
      if (bl) { ctx.strokeStyle = OL; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-34, -30); ctx.lineTo(-14, -30); ctx.moveTo(14, -30); ctx.lineTo(34, -30); ctx.stroke(); }
      else { circ(-24, -30, 9, OL, 0); circ(24, -30, 9, OL, 0); circ(-21, -33, 3, '#FFF', 0); circ(27, -33, 3, '#FFF', 0); }
      ctx.strokeStyle = OL; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, -4, 20, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,120,.4)'; ctx.beginPath(); ctx.arc(-42, -6, 9, 0, TAU); ctx.arc(42, -6, 9, 0, TAU); ctx.fill();
    }
    txt('Mobile JKN', 0, 62, { s: 20, w: 700, c: C.tealD, al: 'center' });
    if (o.ring) {
      at(84, -118, 1, () => { ctx.rotate(Math.sin(t * 18) * .3); bell(0, 0, 54, C.yellow); });
      circ(112, -146, 16, C.red, 3); txt('1', 112, -139, { s: 20, w: 700, c: '#FFF', al: 'center' });
      for (let i = 0; i < 3; i++) { const p = (t * 1.2 + i / 3) % 1; ctx.save(); ctx.globalAlpha *= 1 - p; ctx.strokeStyle = C.yellow; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(84, -118, 40 + p * 70, -1.2, .2); ctx.stroke(); ctx.restore(); }
    }
  });
}
function bell(x, y, s, col) {
  ctx.beginPath();
  ctx.moveTo(x - s * .5, y + s * .3);
  ctx.quadraticCurveTo(x - s * .38, y + s * .18, x - s * .38, y - s * .1);
  ctx.quadraticCurveTo(x - s * .38, y - s * .55, x, y - s * .58);
  ctx.quadraticCurveTo(x + s * .38, y - s * .55, x + s * .38, y - s * .1);
  ctx.quadraticCurveTo(x + s * .38, y + s * .18, x + s * .5, y + s * .3);
  ctx.closePath(); paint(col, 4);
  circ(x, y + s * .42, s * .12, col, 4);
}
/* ---------- bangunan & properti ---------- */
function building(x, gy, w, h, wall, roof, label, o = {}) {
  // x = pusat
  const l = x - w / 2, top = gy - h;
  rbox(l, top, w, h, 10, wall, 6);

  withA(eo(pr(lt, 3.8, .5)), () => {
    txt('SESUDAH', 80, 420, { s: 30, w: 700, c: C.tealD });
    ctx.strokeStyle = '#E9D8A6'; ctx.lineWidth = 60; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.strokeStyle = OL; ctx.lineWidth = 4; ctx.setLineDash([18, 16]);
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.setLineDash([]);
  });
  const run = pr(lt, 4.6, 9.6) * 5;
  pts.forEach(([x, y], i) => withA(pop(pr(lt, 4.2 + i * .45, .5)), () => {
    const on = run >= i - .01;
    circ(x, y, 62, on ? C.teal : '#FFFFFF', 6);
    stopIcon(i, x, y, 1);
    rbox(x - 128, y + 76, 256, 56, 28, on ? '#FFFFFF' : '#F1F3F6', 4);
    txt(stops[i], x, y + 113, { s: 24, w: 700, al: 'center' });
    txt(String(i + 1), x - 52, y - 40, { s: 30, w: 700, c: on ? '#FFF' : OL, al: 'center', stroke: 0 });
  }));
  // Pak Darmo berjalan
  if (lt > 4.6) {
    const r = clamp(run, 0, 5), i0 = Math.floor(Math.min(r, 4.999)), f = r - i0;
    const [x0, y0] = pts[i0], [x1, y1] = pts[Math.min(5, i0 + 1)];
    const moving = (f > .05 && f < .95) && run < 5;
    person(lerp(x0, x1, eio(f)), lerp(y0, y1, eio(f)) - 70, .62, { ...DARMO, walk: moving ? lt * 8 : null, mood: 'happy', arm: run >= 5 ? 'cheer' : 'down' }, lt);
  }
  // kurung perlindungan
  withA(eo(pr(lt, 14.6, .6)), () => {
    ctx.strokeStyle = C.yellow; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(120, 845); ctx.lineTo(1395, 845); ctx.lineTo(1395, 820); ctx.stroke();
    ctx.strokeStyle = C.teal; ctx.beginPath(); ctx.moveTo(1450, 820); ctx.lineTo(1450, 845); ctx.lineTo(1800, 845); ctx.lineTo(1800, 820); ctx.stroke();
    rbox(500, 860, 520, 64, 32, C.yellow, 5); txt('Perlindungan PREVENTIF', 760, 903, { s: 30, w: 700, al: 'center' });
    rbox(1440, 860, 370, 64, 32, C.teal, 5); txt('REPRESIF', 1625, 903, { s: 30, w: 700, al: 'center', c: '#FFF' });
  });
}

/* 8. Tips */
function tipArt(i, lt) {

  }
  if (i === 5) {
    person(330, 880, 1.1, { ...DARMO, arm: 'stop', mood: 'worried' }, lt);
    person(800, 880, 1.1, { skin: C.skin3, shirt: '#2B2D42', pants: '#222', hair: 'cap', hairCol: '#555', mask: true, mood: 'sly', arm: 'point', flip: true, seed: 2 }, lt);
    bubbleSay(800, 420, 330, 'Minta kode OTP-nya, Pak…', 800, 560, 1, { s: 26 });
    xBadge(560, 470, 1.3);
    at(560, 640, 1, () => { lock(0, 0, 1); });
  }
}
function camera(x, y, s, flash) {
  at(x, y, s, () => {
    rbox(-80, -50, 160, 110, 20, '#555B6E', 5); rbox(-30, -70, 60, 26, 8, '#555B6E', 4);
    circ(0, 6, 36, '#BFE7FF', 5); circ(0, 6, 18, OL, 0);
    if (flash) { ctx.fillStyle = 'rgba(255,255,200,.9)'; ctx.beginPath(); ctx.arc(60, -40, 50, 0, TAU); ctx.fill(); }
  });
}
function lock(x, y, s) {
  at(x, y, s, () => {
    ctx.strokeStyle = OL; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(0, -30, 30, Math.PI, 0); ctx.stroke();
    ctx.strokeStyle = C.yellow; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, -30, 30, Math.PI, 0); ctx.stroke();
    rbox(-46, -32, 92, 76, 12, C.yellow, 5); circ(0, 2, 9, OL, 0);
    txt('OTP', 0, 36, { s: 18, w: 700, al: 'center' });
  });
}
function s8(lt, D) {
  sky(lt, 880);
  sceneTitle(lt, 'UNTUK MASYARAKAT', C.orange, '6 tips praktis agar tidak menjadi korban');
  const tips = [
    ['Cek status rutin', 'Sebelum berobat, cek lewat Mobile JKN, PANDAWA 0811-8165-165, atau Care Center 165. Bantu keluarga yang tidak punya ponsel pintar.'],

  const cur = lt < 4 ? -1 : Math.min(5, Math.floor((lt - 4) / 4));

    person(560, 900, 1.2, { ...DARMO, arm: 'wave', mood: 'happy', talk: false }, lt);

    tips.forEach((tp, i) => withA(pop(pr(lt, .8 + i * .3, .5)), () => {

    // titik progres
    for (let i = 0; i < 6; i++) circ(1250 + i * 50, 905, i === cur ? 14 : 10, i <= cur ? C.orange : '#FFFFFF', 4);

}

/* ---------- jadwal ---------- */
const SCENES = [
  { d: 9, f: s0 }, { d: 22, f: s1 }, { d: 13, f: s2 }, { d: 15, f: s3 }, { d: 20, f: s4 },
  { d: 34, f: s5 }, { d: 34, f: s6 }, { d: 22, f: s7 }, { d: 30, f: s8 }, { d: 10, f: s9 },
];
const KQ = (new URLSearchParams(location.search).get('k') || '').split(',').map(parseFloat);
let acc = 0; SCENES.forEach((s, i) => { s.k = KQ[i] > 0 ? KQ[i] : 1; s.dr = s.d * s.k; s.a = acc; acc += s.dr; });
const TOTAL = acc;
let SUBS = [];
window.setSubs = s => { SUBS = s; };

function subtitle(t) {
  const s = SUBS.find(x => t >= x[0] && t < x[1]);
  if (!s) return;
  const a = Math.min(eo((t - s[0]) / .2), eo((s[1] - t) / .2));
  withA(a, () => {
    const L = lines(s[2], 1560, 34, 500);
    const h = L.length * 44 + 26;
    let w = 0; ctx.font = `500 34px ${F}`; L.forEach(l => w = Math.max(w, ctx.measureText(l).width));
    rr(960 - w / 2 - 30, 1050 - h, w + 60, h, 22); ctx.fillStyle = 'rgba(30,32,48,.82)'; ctx.fill();
    L.forEach((l, i) => txt(l, 960, 1050 - h + 13 + 34 + i * 44 - 4, { s: 34, w: 500, c: '#FFFFFF', al: 'center' }));
  });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  const sc = SCENES.find(s => t >= s.a && t < s.a + s.dr) || SCENES[SCENES.length - 1];
  const lt = t - sc.a;
  ctx.save();
  sc.f(lt / sc.k, sc.d);
  ctx.restore();
  // transisi: tirai lingkaran
  const fin = sc === SCENES[0] ? 1 : clamp(lt / .45), fout = sc === SCENES[SCENES.length - 1] ? clamp((sc.dr - lt) / 1.2) : clamp((sc.dr - lt) / .45);
  const k = Math.min(fin, fout);
  if (k < 1) {
    ctx.save();
    ctx.fillStyle = sc === SCENES[SCENES.length - 1] && fout < 1 ? `rgba(43,45,66,${1 - fout})` : '#FFD166';
    if (sc === SCENES[SCENES.length - 1] && fout < 1) ctx.fillRect(0, 0, W, H);
    else { ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(960, 540, 1150 * eio(k), 0, TAU, true); ctx.fill(); }
    ctx.restore();
  }
  subtitle(t);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = C.teal; ctx.fillRect(0, H - 8, W * (t / TOTAL), 8);
}

window.TOTAL = TOTAL;
window.render = render;
window.ready = Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px Fredoka`)));
const qs = new URLSearchParams(location.search);
if (!qs.has('capture')) {
  window.ready.then(() => {
    if (qs.has('t')) render(parseFloat(qs.get('t')));
    else { const st = performance.now(); const loop = () => { render(((performance.now() - st) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
  });
}
